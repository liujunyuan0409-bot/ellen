# 五感月度销售表 · 清洗规则（唯一口径来源）
# 改口径 = 改这个文件；build_report.py 只读这里，不在代码里硬编码业务规则。

# 主表分类顺序（沿用 2025-08 ~ 12 手工表的顺序）；不在列表里的新分类排在最后，并在「异常与调整」里提示
category_order:
  - 意式 Espresso
  - 手冲咖啡 Pour-Over
  - Combo
  - 创意咖啡 Special
  - 无咖啡因 DeCaf
  - 咖啡豆/挂耳包
  - 烘焙Bake
  - 可可排块
  - 五感周边
  - 泼泼人宠友好
  - 宠物零食 Pet Snacks
  - 大众团购
  - 其他

# 规格：后台规格是一串选项组合（如「正常浓度 瑰夏拼配 正常冰」），只保留 keep 里的选项作为「规格」层。
# 未在 spec_rules 里出现的分类：不展开规格。
# 出现 keep/drop 都没登记的新选项 → 脚本停下，让人决定归 keep 还是 drop。
spec_rules:
  意式 Espresso:
    keep: [瑰夏拼配, 深烘拼配, 蜜瓜, 蜜瓜冰淇淋, 艾力达, 巴拿马 艾力达, 哥伦比亚 圣洁, 紫风铃, 绿宝石]
    drop: [正常浓度, 加一份浓缩, 冰, 热, 正常冰, 少冰, 去冰, 鲜牛奶（默认）, 换燕麦奶, 冰黑咖, 热黑咖, 热奶咖]
  五感周边:
    keep: [黑色, 灰色, 咖色, 绿色, 米色, 米白色, 卡其色, 深灰色, 苔藓绿]
    drop: [S, M, L, XL, XXL, 小（80g）]

# 规格改名（手工表里出现过的人工统一）
spec_rename:
  哥伦比亚 圣洁: 哥伦比亚

# 商品改分类（手工表里出现过的人工调整）。key = 后台商品名（去首尾空格后）
reclassify:
  人宠驱蚊液: 五感周边

# 商品改名。key = 后台商品名（去首尾空格后）
product_rename: {}

# 单价：后台标价 one_price 在明细行上的算术平均（= 2025-08~10 手工透视「平均值项」口径）
# 1 元计价商品（补差价、自定义金额类）：0 < one_price <= 阈值 的行（标价 0 = 赠品，留在主表）不进主表，单独放「1元计价」sheet；
# 主表占比的分母 = 主表合计（不含这些行）
one_yuan_price_max: 1

# ---- 异常剔除（非真实消费）----
# 单笔 ≥ threshold 的「已支付订单」或「余额商家扣除」都是候选：脚本会停下列出来，由人确认后写进下面两个清单之一。
# 记录只用 时间 + 金额 识别（仓库公开，不写用户信息）。
anomaly:
  threshold: 10000
  # 已确认非真实消费的订单：从销售额、订单数、订单额里剔除
  excluded_orders:
    - {pay_time: "2025-10-16 14:47:47", total: 37131, note: "补差价，后台下单（2026-10-13 确认剔除）"}
    - {pay_time: "2025-10-17 14:14:56", total: 38285, note: "补差价，后台下单（2026-10-13 确认剔除）"}
  # 已确认的「充值 → 商家扣回」成对记录：充值和扣除整组剔除（不算储值充值，也不算消费），余额互相抵消
  # topups.amount = 余额流水到账金额（含赠送）；paid = 实付金额（营业报表「储值充值」口径），剔除时扣 paid
  excluded_balance_pairs:
    - note: "2025-08 充 36,000 后 09-09 全额退还（13:04:21 那条重复记录未到账、营业报表也未计入，不列）"
      deduction: {time: "2025-09-09 21:20:38", amount: -36000}
      topups:
        - {time: "2025-08-20 13:05:02", amount: 36000, paid: 36000}
    - note: "2026-03-08 一天充 4×7,276，03-16 商家扣除「消费」29,104"
      deduction: {time: "2026-03-16 16:17:10", amount: -29104}
      topups:
        # 当天营业报表：实付 27,840（含另一笔 288）+ 赠送 1,552 = 到账 29,392 → 每笔实付 6,888、赠送 388
        - {time: "2026-03-08 14:17:21", amount: 7276, paid: 6888}
        - {time: "2026-03-08 15:02:07", amount: 7276, paid: 6888}
        - {time: "2026-03-08 21:02:22", amount: 7276, paid: 6888}
        - {time: "2026-03-08 21:03:06", amount: 7276, paid: 6888}
    - note: "2026-08-17 充 2×10,000，08-23 商家扣除「结算」20,000"
      deduction: {time: "2026-08-23 11:55:09", amount: -20000}
      topups:
        - {time: "2026-08-17 16:17:12", amount: 10000, paid: 10000}
        - {time: "2026-08-17 16:17:42", amount: 10000, paid: 10000}
  # 已确认为真实消费、保留的大额（订单写 pay_time+total；扣除写 time+amount，amount 为负数）
  kept: []
